name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Fresh screenshots of the main screens (the README shows the copies
      # in docs/screenshots). Makkah's time zone, whose prayer times appear.
      - name: Render screenshots
        env:
          SCREENSHOTS: '1'
          TZ: Asia/Riyadh
        run: flutter test test/screenshots_test.dart

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 30

      # Optional: sign with your own key so each new APK can update the
      # previous one. Without these secrets, every run uses a new random debug
      # key, and Android refuses to install it over an older build.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          # One APK that installs on any phone with an ARM processor (nearly
          # all of them). x86_64, used by emulators, has its own file below.
          flutter build apk --release --target-platform android-arm,android-arm64 --build-name=$VERSION --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/manhaj-hayah.apk
          # Smaller APKs, one per processor type
          flutter build apk --release --split-per-abi --build-name=$VERSION --build-number=${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk ../../../../dist/manhaj-hayah-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk ../../../../dist/manhaj-hayah-armeabi-v7a.apk
          cp app-x86_64-release.apk ../../../../dist/manhaj-hayah-x86_64.apk

      # The "light" build leaves the 604 mushaf page images (about 41 MB) out
      # of the APK; the app downloads each page the first time it is opened.
      # Same code, same signing key, built with --dart-define=LITE=true.
      - name: Build light APKs
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          rm -rf assets/quran-images
          sed -i '/assets\/quran-images\//d' pubspec.yaml
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=LITE=true --build-name=$VERSION --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk dist/manhaj-hayah-lite.apk
          flutter build apk --release --split-per-abi --dart-define=LITE=true --build-name=$VERSION --build-number=${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk ../../../../dist/manhaj-hayah-lite-arm64-v8a.apk
          cp app-armeabi-v7a-release.apk ../../../../dist/manhaj-hayah-lite-armeabi-v7a.apk
          cd ../../../..
          # Put the images back so the app bundle below still contains them.
          git checkout -- pubspec.yaml assets/quran-images
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk
          retention-days: 30

      # The bundle Google Play asks for. Only worth building when it is signed
      # with the upload key, and only for what gets released.
      - name: Build app bundle for Google Play
        if: env.HAS_KEYSTORE == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          flutter build appbundle --release --build-name=$VERSION --build-number=${{ github.run_number }}
          mkdir -p aab
          cp build/app/outputs/bundle/release/app-release.aab aab/manhaj-hayah.aab

      - uses: actions/upload-artifact@v7
        if: env.HAS_KEYSTORE == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: aab
          path: aab/*.aab
          retention-days: 30

  # Every merge into master (and every v* tag) publishes a release with
  # direct APK download links, so the app can be installed from a phone
  # without signing in to GitHub or unzipping an artifact.
  release:
    name: Publish GitHub release
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      # Present only when the signing secrets are set.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aab
          path: dist

      - name: Choose version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: منهج حياة ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            dist/manhaj-hayah.apk
            dist/manhaj-hayah-arm64-v8a.apk
            dist/manhaj-hayah-armeabi-v7a.apk
            dist/manhaj-hayah-lite.apk
            dist/manhaj-hayah-lite-arm64-v8a.apk
            dist/manhaj-hayah-lite-armeabi-v7a.apk
            dist/manhaj-hayah.aab
          body: |
            ## التثبيت على الهاتف
            حمّل **`manhaj-hayah.apk`** من قسم Assets في الأسفل وافتحه على هاتفك (يعمل على أي هاتف Android).

            ملفات أصغر حجماً لمن يعرف نوع معالج هاتفه:
            - `manhaj-hayah-arm64-v8a.apk`: معظم الهواتف الحديثة
            - `manhaj-hayah-armeabi-v7a.apk`: الهواتف القديمة

            عند أول تثبيت قد يطلب الهاتف السماح بـ«تثبيت التطبيقات من مصادر غير معروفة».

            ملف `manhaj-hayah.aab` (إن وُجد) هو الحزمة التي تُرفع إلى Google Play، ولا يُثبَّت مباشرة على الهاتف.
          generate_release_notes: true
