name: Website

# Publishes website/ (with the app screenshots and the latest APK, so the
# download button can show progress) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/screenshots/**'
      - '.github/workflows/website.yml'
  # Re-publish after each release so the hosted APK stays current.
  workflow_run:
    workflows: [Build APK]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r website/. _site/
          cp docs/screenshots/*.png _site/screenshots/

      - name: Add the latest APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/download
          cd _site/download
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk'
          # Releases made before the rename carry the former file names.
          for f in tareeq-aljannah*.apk; do
            [ -e "$f" ] && mv "$f" "manhaj-hayah${f#tareeq-aljannah}"
          done
          # The site hands each phone the build for its processor.
          python3 - "$tag" <<'PY'
          import json, os, sys
          files = {}
          for key, name in [('universal', 'manhaj-hayah.apk'),
                            ('arm64-v8a', 'manhaj-hayah-arm64-v8a.apk'),
                            ('armeabi-v7a', 'manhaj-hayah-armeabi-v7a.apk')]:
              if os.path.exists(name):
                  files[key] = {'file': name, 'size': os.path.getsize(name)}
          info = {'version': sys.argv[1], 'size': files['universal']['size'], 'files': files}
          json.dump(info, open('latest.json', 'w'))
          print(info)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
