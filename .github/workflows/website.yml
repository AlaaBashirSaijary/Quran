name: Website

# Publishes website/ (with the app screenshots) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/screenshots/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r website/. _site/
          cp docs/screenshots/*.png _site/screenshots/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
