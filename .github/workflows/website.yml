name: Website

# Publishes website/ (with the app screenshots and the latest APK, so the
# download button can show progress) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/screenshots/**'
      - '.github/workflows/website.yml'
  # Re-publish after each release so the hosted APK stays current.
  workflow_run:
    workflows: [Build APK]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r website/. _site/
          cp docs/screenshots/*.png _site/screenshots/

      - name: Add the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/download
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          # Releases made before the rename carry the former file name.
          for name in manhaj-hayah.apk tareeq-aljannah.apk; do
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir _site/download; then
              [ "$name" = manhaj-hayah.apk ] || mv "_site/download/$name" _site/download/manhaj-hayah.apk
              break
            fi
          done
          size=$(stat -c %s _site/download/manhaj-hayah.apk)
          printf '{"version":"%s","size":%s}\n' "$tag" "$size" > _site/download/latest.json
          cat _site/download/latest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
